# Keeps A2B's map data current: once a week it checks for a new Overture Maps release (Overture publishes
# monthly). When there is one, it rebuilds the shop search data (public/places/, not kept in git) and the
# roads under construction (public/construction/), runs the tests, deploys to Cloudflare, and commits the
# new construction data and release number.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN: a Cloudflare API token from the "Edit Cloudflare Workers"
# template. Run it by hand from the Actions tab (Run workflow); tick "force" to rebuild the same release.

name: Map data

on:
  schedule:
    - cron: '23 1 * * 3' # Wednesdays 01:23 UTC (09:23 in Malaysia)
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and deploy even if the release hasn't changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: map-data
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: aa2a448d213c13aa933c4bbe05d8e75e

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Find the newest Overture release
        id: release
        run: |
          latest=$(node scripts/overture-release.mjs)
          current=$(node -p "require('./public/construction/index.json').release")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Already on Overture $current; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updating from Overture $current to $latest." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.release.outputs.build == 'true'
        with:
          python-version: '3.12'

      - name: Build the place and construction data
        if: steps.release.outputs.build == 'true'
        run: |
          pip install duckdb
          npm ci
          release=${{ steps.release.outputs.latest }}
          sed -i "s/^DEFAULT_RELEASE = .*/DEFAULT_RELEASE = '$release'/" scripts/build-places.py scripts/build-construction.py
          python3 scripts/build-places.py --release "$release"
          python3 scripts/build-construction.py --release "$release"

      - name: Test
        if: steps.release.outputs.build == 'true'
        run: npm test

      - name: Deploy
        if: steps.release.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Commit the new construction data
        if: steps.release.outputs.build == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/construction scripts/build-places.py scripts/build-construction.py
          git diff --cached --quiet && exit 0
          git commit -m "Map data: Overture ${{ steps.release.outputs.latest }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
